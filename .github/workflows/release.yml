# Builds and publishes prebuilt fe_codec_gen binaries and installer.sh on version tags,
# and dry-runs all targets on workflow_dispatch.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FE_VERSION: v26.7.0

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version consistency
        id: meta
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          ref = os.environ["GITHUB_REF"]
          ref_name = os.environ["GITHUB_REF_NAME"]

          if ref.startswith("refs/tags/v"):
              version = ref_name.removeprefix("v")
          elif ref.startswith("refs/tags/"):
              raise SystemExit(f"expected tag starting with 'v', got {ref_name!r}")
          else:
              gen = tomllib.loads(pathlib.Path("tools/generator/fe.toml").read_text("utf-8"))
              version = gen["ingot"]["version"]

          if not version:
              raise SystemExit("empty version")

          ws = tomllib.loads(pathlib.Path("fe.toml").read_text("utf-8"))
          ws_version = ws["workspace"]["version"]
          if ws_version != version:
              raise SystemExit(f"fe.toml: expected version {version!r}, got {ws_version!r}")

          ingots = [
              "ingots/io/fe.toml",
              "ingots/core/fe.toml",
              "ingots/json/fe.toml",
              "ingots/cbor/fe.toml",
              "ingots/eip712/fe.toml",
              "tools/syntax/fe.toml",
              "tools/codegen/fe.toml",
              "tools/generator/fe.toml",
              "tools/syntax-dump/fe.toml",
          ]
          for path in ingots:
              data = tomllib.loads(pathlib.Path(path).read_text("utf-8"))
              got = data["ingot"]["version"]
              if got != version:
                  raise SystemExit(f"{path}: expected version {version!r}, got {got!r}")

          cli_text = pathlib.Path("tools/generator/src/cli.fe").read_text("utf-8")
          needle = f'format!("fe_codec_gen {version}\\n")'
          if needle not in cli_text:
              raise SystemExit(f"tools/generator/src/cli.fe: expected {needle}")

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"commit={commit}\n")
          print(f"Verified version {version} at {commit}")
          PY

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Fe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh \
            | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"

      - name: Build fe_codec_gen
        run: |
          fe build --backend native tools/generator --out-dir dist
          chmod +x dist/fe_codec_gen

      - name: Inspect binary linkages (Linux)
        if: runner.os == 'Linux'
        run: |
          file dist/fe_codec_gen
          ldd dist/fe_codec_gen

      - name: Inspect binary linkages (macOS)
        if: runner.os == 'macOS'
        run: |
          file dist/fe_codec_gen
          otool -L dist/fe_codec_gen

      - name: Package release archive
        run: |
          mkdir -p release
          COPYFILE_DISABLE=1 tar -C dist -czf "release/fe_codec_gen-${{ matrix.target }}.tar.gz" fe_codec_gen

      - name: Smoke test installer and fe_codec_gen
        run: |
          ARCHIVE="fe_codec_gen-${{ matrix.target }}.tar.gz"
          python3 - "$ARCHIVE" <<'PY'
          import hashlib, pathlib, sys
          name = sys.argv[1]
          digest = hashlib.sha256(pathlib.Path("release", name).read_bytes()).hexdigest()
          pathlib.Path("release/SHA256SUMS").write_text(f"{digest}  {name}\n", encoding="utf-8")
          PY
          mkdir -p "$RUNNER_TEMP/home"
          FE_CODEC_DOWNLOAD_URL="file://$PWD/release" HOME="$RUNNER_TEMP/home" \
            sh install/installer.sh --no-modify-path
          GEN="$RUNNER_TEMP/home/.local/bin/fe_codec_gen"
          actual="$("$GEN" --version)"
          expected="fe_codec_gen ${{ needs.verify.outputs.version }}"
          if [ "$actual" != "$expected" ]; then
            echo "expected '$expected', got '$actual'" >&2
            exit 1
          fi
          python3 tests/vanilla.py --generator "$GEN"
          rm release/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: fe_codec_gen-${{ matrix.target }}
          path: release/fe_codec_gen-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Add installer and checksums
        run: |
          cp install/installer.sh release/installer.sh
          cd release
          sha256sum fe_codec_gen-*.tar.gz installer.sh | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import textwrap

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          commit = os.environ["COMMIT"]
          repo = os.environ["REPO"]
          fe_version = os.environ["FE_VERSION"]

          notes = textwrap.dedent(f"""\
              Fe Codec **{version}** (built with Fe `{fe_version}`).

              ## Install `fe_codec_gen`

              ```sh
              curl -fsSL https://github.com/{repo}/releases/download/{tag}/installer.sh | sh
              ```

              Or install the latest release directly via `releases/latest/download/installer.sh`. Checksums are published in `SHA256SUMS`.

              Build from source instead:

              ```sh
              git clone https://github.com/{repo}.git && cd fe-codec && git checkout {tag}
              fe build --backend native tools/generator --out-dir ~/.local/bin
              ```

              ## Add the ingots to `fe.toml`

              ```toml
              [dependencies]
              fe_codec_core = {{ source = "https://github.com/{repo}.git", rev = "{commit}", name = "fe_codec_core" }}
              fe_codec_json = {{ source = "https://github.com/{repo}.git", rev = "{commit}", name = "fe_codec_json" }}
              fe_codec_cbor = {{ source = "https://github.com/{repo}.git", rev = "{commit}", name = "fe_codec_cbor" }}
              # fe_codec_eip712 = {{ source = "https://github.com/{repo}.git", rev = "{commit}", name = "fe_codec_eip712" }}
              ```
          """)
          pathlib.Path("release/notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="Fe Codec ${{ needs.verify.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/fe_codec_gen-*.tar.gz release/installer.sh release/SHA256SUMS --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release/notes.md
          else
            gh release create "$TAG" release/fe_codec_gen-*.tar.gz release/installer.sh release/SHA256SUMS \
              --title "$TITLE" --notes-file release/notes.md
          fi
