[project]
name = "codec_transfer"
version = "0.1.0"

[toolchain]
fe = "26.6.0"

[modules.io]
path = "../../io"

[modules.core]
path = "../../core"

[modules.json]
path = "../../formats/json"

[modules.cbor]
path = "../../formats/cbor"

[modules.eip712]
path = "../../formats/eip712"

[modules.compact]
path = "../compact_format"

[modules.shared]
path = "shared"

[modules.shared.generate.serializers]
command = [
    "../../../tools/fe-codec-gen",
    "--source", "src/models.fe", "--source", "src/typed.fe", "--stdout",
]
output = "src/serializers.fe"

# A second generator in the same module: static EIP-712 hashing for #[eip712] structs.
[modules.shared.generate.eip712]
command = [
    "../../../tools/fe-codec-gen",
    "--source", "src/models.fe", "--source", "src/typed.fe", "--eip712", "--stdout",
]
output = "src/eip712.fe"

[modules.contract]
path = "evm"
platform = "evm"

[modules.cli]
path = "native"
platform = "native"

[modules.web]
path = "wasm"
platform = "wasm"
