[project]
name = "codec_transfer"
version = "0.1.0"

[toolchain]
fe = "26.7.0"

[modules.io]
path = "../../io"

[modules.core]
path = "../../core"

[modules.json]
path = "../../formats/json"

[modules.cbor]
path = "../../formats/cbor"

[modules.eip712]
path = "../../formats/eip712"

[modules.compact]
path = "../compact_format"

[modules.shared]
path = "shared"

# Tests that run on every platform, in their own modules: `fe test` on the EVM backend deploys
# all the tests of a module as one contract, and Fe 26.7.0 rejects one that is too large
# (CreateContractSizeLimit; 990 KB of code deploys, 1.2 MB does not). Keep each module's tests
# well under that; see tools/README.md.
[modules.eip712_tests]
path = "eip712_tests"

[modules.codec_field_tests]
path = "codec_field_tests"

[modules.unknown_fields_tests]
path = "unknown_fields_tests"

[modules.shared.generate.serializers]
command = [
    "../../../tools/fe_codec_gen",
    "--source", "src/models.fe", "--source", "src/typed.fe", "--stdout",
]
output = "src/serializers.fe"

# A second generator in the same module: static EIP-712 hashing for #[eip712] structs.
[modules.shared.generate.eip712]
command = [
    "../../../tools/fe_codec_gen",
    "--source", "src/models.fe", "--source", "src/typed.fe", "--eip712", "--stdout",
]
output = "src/eip712.fe"

[modules.contract]
path = "evm"
platform = "evm"

[modules.cli]
path = "native"
platform = "native"

[modules.web]
path = "wasm"
platform = "wasm"
